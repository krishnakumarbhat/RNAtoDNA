<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RNA to DNA Converter{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        --card-bg: rgba(255, 255, 255, 0.05);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        color: var(--text-primary);
        overflow-x: hidden;
      }

      /* Animated background */
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .bg-animation .circle {
        position: absolute;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        animation: float 20s infinite ease-in-out;
      }

      .bg-animation .circle:nth-child(1) {
        width: 600px;
        height: 600px;
        top: -200px;
        right: -100px;
        animation-delay: 0s;
      }

      .bg-animation .circle:nth-child(2) {
        width: 400px;
        height: 400px;
        bottom: -150px;
        left: -100px;
        animation-delay: -5s;
      }

      .bg-animation .circle:nth-child(3) {
        width: 300px;
        height: 300px;
        top: 50%;
        left: 50%;
        animation-delay: -10s;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(50px, 50px) rotate(90deg); }
        50% { transform: translate(0, 100px) rotate(180deg); }
        75% { transform: translate(-50px, 50px) rotate(270deg); }
      }

      /* Navigation */
      .navbar-custom {
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem 0;
      }

      .navbar-brand {
        font-weight: 700;
        font-size: 1.5rem;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .navbar-brand i {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Main container */
      .main-container {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      /* Card styles */
      .converter-card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 3rem;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }

      .converter-card h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .converter-card .subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      /* Upload area */
      .upload-area {
        border: 2px dashed rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 3rem 2rem;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.02);
        margin-bottom: 1.5rem;
      }

      .upload-area:hover, .upload-area.dragover {
        border-color: #667eea;
        background: rgba(102, 126, 234, 0.1);
      }

      .upload-area i {
        font-size: 3rem;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }

      .upload-area h3 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }

      .upload-area p {
        color: var(--text-secondary);
        margin-bottom: 0;
      }

      .upload-area .file-name {
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        background: rgba(102, 126, 234, 0.2);
        border-radius: 50px;
        display: inline-block;
        font-weight: 500;
      }

      #file-input {
        display: none;
      }

      /* Button styles */
      .btn-convert {
        width: 100%;
        padding: 1rem 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: var(--primary-gradient);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-convert:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px -10px rgba(102, 126, 234, 0.5);
      }

      .btn-convert:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-download {
        width: 100%;
        padding: 1rem 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        margin-top: 1rem;
      }

      .btn-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px -10px rgba(56, 239, 125, 0.5);
        color: white;
      }

      /* Alert styles */
      .alert-custom {
        border: none;
        border-radius: 12px;
        padding: 1rem 1.5rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .alert-custom.success {
        background: rgba(56, 239, 125, 0.15);
        color: #38ef7d;
      }

      .alert-custom.error {
        background: rgba(245, 87, 108, 0.15);
        color: #f5576c;
      }

      .alert-custom i {
        font-size: 1.25rem;
      }

      /* Features section */
      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .feature {
        text-align: center;
        padding: 1rem;
      }

      .feature i {
        font-size: 1.5rem;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .feature h4 {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .feature p {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin: 0;
      }

      /* DNA animation */
      .dna-icon {
        display: inline-block;
        animation: rotate 10s linear infinite;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Responsive */
      @media (max-width: 576px) {
        .converter-card {
          padding: 2rem 1.5rem;
        }

        .converter-card h1 {
          font-size: 1.75rem;
        }

        .features {
          grid-template-columns: 1fr;
        }

        .upload-area {
          padding: 2rem 1rem;
        }
      }

      /* Footer */
      .footer {
        text-align: center;
        padding: 1rem;
        color: var(--text-secondary);
        font-size: 0.85rem;
      }

      .footer a {
        color: #667eea;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- Background animation -->
    <div class="bg-animation">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="bi bi-bezier2 dna-icon"></i> RNA to DNA
        </a>
      </div>
    </nav>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="container mt-3">
          {% for category, message in messages %}
            <div class="alert-custom {{ 'success' if category == 'success' else 'error' }}">
              <i class="bi {{ 'bi-check-circle-fill' if category == 'success' else 'bi-exclamation-circle-fill' }}"></i>
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Main content -->
    <div class="main-container">
      {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Built with <i class="bi bi-heart-fill" style="color: #f5576c;"></i> for researchers</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block javascript %}{% endblock %}
  </body>
</html>
