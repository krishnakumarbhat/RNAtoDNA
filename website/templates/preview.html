{% extends "base.html" %}

{% block title %}Preview{% endblock %}

{% block content %}
<div class="converter-card" style="max-width: 900px;">
  <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Preview</h1>
  <p class="subtitle" style="margin-bottom: 1rem;">Showing first 200 lines of <code>{{ filename }}</code> ({{ total_lines }} total)</p>

  <div style="background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1rem; overflow:auto; max-height: 60vh;">
    <pre style="color: rgba(255,255,255,0.9); margin: 0; font-size: 0.9rem;">
{% for line in preview_lines %}{{ line | e }}{% endfor %}
    </pre>
  </div>

  <div class="d-grid gap-2 mt-3">
    <a class="btn-download" href="{{ url_for('views.download_file', filename=filename) }}">
      <i class="bi bi-download"></i>
      Download
    </a>
    <a class="btn btn-outline-light" href="/" style="border-radius: 12px;">Back</a>
  </div>
</div>
{% endblock %}
